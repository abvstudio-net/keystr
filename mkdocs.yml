site_name: nos2x-fox
site_description: Firefox Nostr signer add-on (NIP-07)
site_url: https://abvstudio.net/nos2x-fox/
repo_url: https://github.com/abvstudio-net/nos2x-fox

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple

nav:
  - Home: index.md
  - Proposals:
      - proposals/index.md
      - Passkey key protection: proposals/01-passkey-key-protection.md
      - Batching & policies: proposals/02-batching-and-policies.md
      - Cross-browser Manifest V3: proposals/03-cross-browser-mv3.md
      - Remote signer (NIP-46): proposals/04-remote-signer-nip46.md
      - Upstream feature ports: proposals/05-upstream-feature-ports.md
  - Security:
      - Vulnerabilities: security/vulnerabilities.md

markdown_extensions:
  - admonition
  - attr_list
